apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: lab-23
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
      - name: web
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: app-config
          mountPath: /wrong/config
          readOnly: true
      volumes:
      - name: app-config
        configMap:
          name: files-a
---
