apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-controller
  namespace: lab-18
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-controller
  template:
    metadata:
      labels:
        app: ingress-controller
    spec:
      serviceAccountName: ingress-controller
      containers:
      - name: controller
        image: registry.k8s.io/ingress-nginx/controller:v1.12.1
        args:
        - /nginx-ingress-controller
        - --election-id=lab18-leader
        - --controller-class=example.com/lab18-ingress
        - --ingress-class=lab18
        - --watch-ingress-without-class=false
        ports:
        - name: http
          containerPort: 80
        - name: health
          containerPort: 10254
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            add: ["NET_BIND_SERVICE"]
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-controller
  namespace: lab-18
spec:
  type: NodePort
  selector:
    app: ingress-controller
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30090
---
