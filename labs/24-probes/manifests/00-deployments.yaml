apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: lab-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
      - name: web
        image: nginx:1.27
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /wrong-health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /wrong-ready
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5

